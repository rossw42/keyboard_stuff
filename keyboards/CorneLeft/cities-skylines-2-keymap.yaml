        {t: "PgDn", h: "↓ Elevation"},
        {t: ".", h: "Photo Mode"},
        {t: "Enter", h: "Take Photo"},
        {t: "", type: "trans"}
      ]
    - [
        {t: "", type: "trans"},
        {t: "", type: "trans"},
        {t: "", type: "trans"},
        {t: "", type: "trans"},
        {t: "", type: "trans"},
        {t: "", type: "trans"}
      ]
    - [
        {t: "", type: "trans"},
        {t: "L2", h: "Editor Layer", type: "held"},
        {t: "", type: "trans"}
      ]

  Editor:
    - [
        {t: "C", h: "Clone"},
        {t: "O", h: "Auto Connect"},
        {t: "P", h: "Auto Align"},
        {t: "M", h: "Move Selected"},
        {t: "", type: "trans"},
        {t: "", type: "trans"}
