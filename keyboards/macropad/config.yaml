meta:
  engine: 4.1.0
  name: "4x4-macropad"
  version: "1.0"
  author: "Ergogen User"
  description: "Simple 4x4 macropad with RP2040"

units:
  kx: 19.05  # MX key spacing horizontal
  ky: 19.05  # MX key spacing vertical
  px: 2      # padding
  
  # Pro Micro dimensions
  mcu_width: 18   # Pro Micro width
  mcu_height: 33  # Pro Micro height
  
  # Board dimensions
  board_width: 4*kx + 10
  board_height: 4*ky + 25
  
points:
  zones:
    matrix:
      anchor:
        shift: [50, -150]  # Center on KiCad sheet
      key:
        padding: ky
        spread: kx
        tags: [key]
      columns:
        col0:
          key.column_net: GP0
        col1:
          key.column_net: GP1
        col2:
          key.column_net: GP2
        col3:
          key.column_net: GP3
      rows:
        row0:
          row_net: GP4
        row1:
          row_net: GP5
        row2:
          row_net: GP6
        row3:
          row_net: GP7

outlines:
  # Simple rectangular board outline
  board:
    - what: rectangle
      where:
        ref: matrix_col1_row1
        shift: [kx/2, 0]  # Center between keys
      size: [board_width, board_height]  # Use calculated dimensions
      corner: 3

  # Switch cutouts
  switches:
    - what: rectangle
      where: [key]
      size: [14, 14]

  # Mounting holes between switches
  mounting_holes:
    - what: circle
      where:
        ref: matrix_col0_row0
        shift: [kx/2, ky/2]  # Between col0/col1, row0/row1
      radius: 1.1
    - what: circle
      where:
        ref: matrix_col2_row0
        shift: [kx/2, ky/2]  # Between col2/col3, row0/row1
      radius: 1.1
    - what: circle
      where:
        ref: matrix_col0_row2
        shift: [kx/2, ky/2]  # Between col0/col1, row2/row3
      radius: 1.1
    - what: circle
      where:
        ref: matrix_col2_row2
        shift: [kx/2, ky/2]  # Between col2/col3, row2/row3
      radius: 1.1

  # PCB outline
  pcb:
    - board
    - -mounting_holes

  # Switch plate outline  
  plate:
    - board
    - -switches
    - -mounting_holes

pcbs:
  macropad:
    template: kicad8
    outlines:
      edge:
        outline: pcb
        layer: Edge.Cuts
    footprints:
      # MX switches with hotswap sockets
      switches:
        what: mx
        where: [key]
        params:
          hotswap: true
          keycaps: true
          from: "{{colrow}}"
          to: "{{column_net}}"
      
      # Diodes for each switch - rotated horizontal below switches
      diodes:
        what: diode
        where: [key]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -6]  # Below each switch
          rotate: 0       # Horizontal orientation instead of vertical
      
      # RP2040 microcontroller - calculated position at top edge
      mcu:
        what: promicro
        where:
          ref: matrix_col1_row1  # Use same reference as board outline
          shift: [kx/2, board_height/2 - mcu_height/2 - 3]  # At top edge with 3mm margin from edge
          rotate: 270  # USB pointing toward keys
        params:
          orientation: down
          # Pin assignments for 4x4 matrix
          P0: GP0   # col0
          P1: GP1   # col1  
          P2: GP2   # col2
          P3: GP3   # col3
          P4: GP4   # row0
          P5: GP5   # row1
          P6: GP6   # row2
          P7: GP7   # row3
      
      # Reset button - positioned near MCU
      reset:
        what: button
        where:
          ref: matrix_col2_row3
          shift: [0, -20]  # Near MCU but accessible
        params:
          from: GND
          to: RST
      
      # Mounting holes as footprints - between switches
      mount_tl:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_col0_row0
          shift: [kx/2, ky/2]
      mount_tr:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_col2_row0
          shift: [kx/2, ky/2]
      mount_bl:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_col0_row2
          shift: [kx/2, ky/2]
      mount_br:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_col2_row2
          shift: [kx/2, ky/2]

cases:
  # Simple bottom plate
  bottom_plate:
    - name: board
      extrude: 1.6
    - operation: subtract
      name: mounting_holes
      extrude: 1.6
  
  # Simple switch plate
  switch_plate:
    - name: plate
      extrude: 1.6