draw_config:
  key_w: 60
  key_h: 80
  split_gap: 30.0
  combo_w: 30
  combo_h: 30
  key_rx: 4.0
  key_ry: 4.0
  dark_mode: true
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 1
  inner_pad_w: 1.5
  inner_pad_h: 1.5
  outer_pad_w: 0.0
  outer_pad_h: 20.0
  line_spacing: 1.0
  arc_radius: 6.0
  append_colon_to_layer_header: false
  small_pad: 4.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: true
  key_side_pars:
    rel_x: 0.0
    rel_y: 8.0
    rel_w: 12.0
    rel_h: 25.0
    rx: 4.0
    ry: 4.0
  svg_extra_style: ''
  footer_text: ''
  shrink_wide_legends: 5
  style_layer_activators: true
  glyph_tap_size: 22
  glyph_hold_size: 16
  glyph_shifted_size: 16
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map:
    '&smart_num Numbers 0':
      shifted: $$mdi:alpha-w-box$$
      tap: Numbers
      hold: $$mdi:gesture-tap-hold$$
    '&csl Functions':
      tap: Functions
      hold: $$mdi:close-box$$
    '&csl Numbers':
      tap: Numbers
      hold: $$mdi:close-box$$
    '&cmo Functions':
      tap: $$mdi:close-box$$
      hold: Functions
    '&cmo Numbers':
      tap: $$mdi:close-box$$
      hold: Numbers
    '&caps_word': $$mdi:alpha-w-box$$
    '&kt RSHIFT':
      tap: $$mdi:apple-keyboard-shift$$
      hold: $$mdi:toggle-switch$$
    '&none':
      tap: $$mdi:minus-circle-outline$$
      type: none
    '&bkspc_del':
      type: backspace
      tap: $$mdi:backspace$$
      shifted: $$mdi:backspace-reverse-outline$$
    '&sys_reset':
      type: bootloader
      tap: $$mdi:backup-restore$$
    '&bootloader':
      tap: $$mdi:progress-download$$
    '&rst_boot 0 0':
      type: bootloader
      tap: $$mdi:backup-restore$$
      hold: $$mdi:progress-download$$
  sticky_label: $$mdi:gesture-tap-hold$$
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    tap: $$mdi:transfer$$
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: true
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AltGr
    left_gui: Gui
    right_gui: Gui
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  qmk_keycode_map:
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
    NUHS: '#'
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    LT: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    GT: '>'
    QUESTION: '?'
    QUES: '?'
  zmk_remove_keycode_prefix: []
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL:
      tap: '='
      shifted: +
    PLUS: +
    MINUS:
      tap: '-'
      shifted: _
    UNDERSCORE: _
    UNDER: _
    SLASH:
      tap: /
      shifted: '?'
    FSLH:
      tap: /
      shifted: '?'
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH:
      tap: \
      shifted: '|'
    BSLH:
      tap: \
      shifted: '|'
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON:
      tap: ;
      shifted: ':'
    SEMI:
      tap: ;
      shifted: ':'
    COLON: ':'
    SINGLE_QUOTE:
      tap: ''''
      shifted: '"'
    SQT:
      tap: ''''
      shifted: '"'
    APOSTROPHE: <
    APOS: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    LESS_THAN: <
    LT: <
    DOT:
      tap: .
      shifted: '>'
    COMMA:
      tap: ','
      shifted: <
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET:
      tap: '['
      shifted: '{'
    LBKT:
      tap: '['
      shifted: '{'
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET:
      tap: ']'
      shifted: '}'
    RBKT:
      tap: ']'
      shifted: '}'
    RIGHT_BRACE: '}'
    RBRC: '}'
    GRAVE:
      tap: '`'
      shifted: '~'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    N1:
      tap: 1
      shifted: '!'
    N2:
      tap: 2
      shifted: '@'
    N3:
      tap: 3
      shifted: '#'
    N4:
      tap: 4
      shifted: $
    N5:
      tap: 5
      shifted: '%'
    N6:
      tap: 6
      shifted: ^
    N7:
      tap: 7
      shifted: '&'
    N8:
      tap: 8
      shifted: '*'
    N9:
      tap: 9
      shifted: (
    N0:
      tap: 0
      shifted: )
    LCTRL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    LCMD: $$mdi:apple-keyboard-command$$
    RCTRL: $$mdi:apple-keyboard-control$$
    RALT: $$mdi:apple-keyboard-option$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RCMD: $$mdi:apple-keyboard-command$$
    LS(LC(LALT)): $$mdi:triangle$$
    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    PG_UP: $$mdi:transfer-up$$
    PG_DN: $$mdi:transfer-down$$
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    LS(TAB): $$mdi:keyboard-tab-reverse$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$
    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$
    C_NEXT: $$mdi:skip-next$$
    C_PREV: $$mdi:skip-previous$$
    C_PP: $$mdi:play-pause$$
    BT_CLR: $$mdi:bluetooth-off$$
    BT_SEL: $$mdi:bluetooth-connect$$
    C_BRI_UP: $$mdi:brightness-5$$
    C_BRI_DN: $$mdi:brightness-7$$
    C_POWER: $$mdi:power-standby$$
    C_AL_LOCK: $$mdi:lock$$
    K_CANCEL: $$mdi:close-box$$
    RG(RS(A)):
      tap: $$mdi:microphone$$
      hold: zoom
    RG(RS(V)):
      tap: $$mdi:video$$
      hold: zoom
  zmk_combos:
    combo_to_2:
      align: top
    combo_to_3:
      align: top
    combo_bt_clear:
      align: top
      offset: 0.03
    combo_mute:
      align: top
      offset: 0.15
    combo_minus:
      key:
        shifted: _
        hold: '-'
    combo_equal:
      key:
        shifted: +
        hold: '='
    combo_backslash:
      key:
        shifted: '|'
        hold: \
    combo_lbkt:
      key:
        shifted: '{'
        hold: '['
    combo_rbkt:
      key:
        shifted: '}'
        hold: ']'
    combo_semicolon:
      key:
        shifted: ':'
        hold: ;
  zmk_preamble: '#define KEYMAP_DRAWER'
  zmk_additional_includes: []
