<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanical Switch Chooser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #eee;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2em;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9em;
    }
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding: 10px 0;
      min-height: 44px;
      align-items: center;
      justify-content: center;
    }
    .crumb {
      background: #4a5568;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .crumb:hover { background: #5a6578; }
    .crumb.type-linear { background: #e53e3e; }
    .crumb.type-tactile { background: #38a169; }
    .crumb.type-clicky { background: #3182ce; }
    .arrow { color: #666; }
    .question {
      font-size: 1.4em;
      margin-bottom: 20px;
      text-align: center;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .option {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      padding: 20px 30px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-width: 140px;
    }
    .option:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }
    .option .label { font-size: 1.1em; font-weight: 600; }
    .option .desc { font-size: 0.8em; color: #aaa; margin-top: 5px; }
    .result h2 { margin-bottom: 20px; color: #feca57; }
    .switches {
      display: inline-flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .result {
      background: linear-gradient(135deg, rgba(72,219,251,0.2), rgba(254,202,87,0.2));
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      display: inline-block;
    }
    .result-wrapper {
      text-align: center;
    }
    .switch-rec {
      background: rgba(0,0,0,0.3);
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 1.1em;
    }
    .switch-rec a {
      color: #eee;
      text-decoration: none;
    }
    .switch-rec a:hover {
      color: #48dbfb;
    }
    .switch-rec:first-child {
      background: rgba(254,202,87,0.3);
      border: 1px solid rgba(254,202,87,0.5);
    }
    .restart {
      margin-top: 25px;
      background: #e53e3e;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
      display: block;
    }
    .restart:hover { background: #c53030; }
    .top-restart {
      margin: 0;
      display: none;
      white-space: nowrap;
    }
    .disclaimer {
      margin-top: 20px;
      font-size: 0.8em;
      color: #888;
    }
    .disclaimer a {
      color: #48dbfb;
    }
    .start-btn {
      display: block;
      margin: 40px auto;
      background: linear-gradient(90deg, #ff6b6b, #feca57);
      color: #1a1a2e;
      border: none;
      padding: 20px 50px;
      border-radius: 12px;
      font-size: 1.3em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .start-btn:hover { transform: scale(1.05); }
    .search-container {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .search-input {
      width: 250px;
      padding: 12px 16px;
      font-size: 1em;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #eee;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: #48dbfb;
      background: rgba(255,255,255,0.15);
    }
    .search-input::placeholder {
      color: #888;
    }
    .search-results {
      margin-top: 15px;
    }
    .search-result-item {
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .search-result-item a {
      color: #eee;
      text-decoration: none;
      font-size: 1em;
    }
    .search-result-item a:hover {
      color: #48dbfb;
    }
    .search-result-path {
      font-size: 0.75em;
      color: #888;
      white-space: nowrap;
    }
    .search-result-path a {
      color: inherit;
      text-decoration: none;
    }
    .search-result-path a:hover {
      text-decoration: underline;
    }

    .search-result-path .type-tactile { color: #68d391; }
    .search-result-path .type-clicky { color: #63b3ed; }
    .search-hint {

      font-size: 0.85em;
      text-align: center;
      margin-top: 10px;
    }

      font-size: 0.85em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Switch Chooser</h1>
    <p class="subtitle">Find your perfect mechanical keyboard switch (until you change your mind next week)</p>
    <div class="search-container">
      <input type="text" class="search-input" id="searchInput" placeholder="Search switches by name..." oninput="handleSearch(this.value)">
      <button class="restart top-restart" id="topRestart" onclick="restart()">Start over</button>
    </div>
      <div id="searchResults"></div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="content"></div>

let path = [];

function getAllSwitches() {
  const results = [];
  const typeLabels = { linear: 'Linear', tactile: 'Tactile', clicky: 'Clicky' };
  const soundLabels = { silent: 'Silent', thocky: 'Thocky', clacky: 'Clacky', bar: 'Sharp & metallic', jacket: 'Thick & plasticky' };
  const forceLabels = { light: 'Light', medium: 'Medium', heavy: 'Heavy', large: 'Large bump', small: 'Small bump' };
  
  for (const [type, sounds] of Object.entries(data)) {
    for (const [sound, forces] of Object.entries(sounds)) {
      for (const [force, switches] of Object.entries(forces)) {
        for (const sw of switches) {
          results.push({
            name: sw,
            type,
            sound,
            force,
            path: `${typeLabels[type]} → ${soundLabels[sound]} → ${forceLabels[force]}`
          });
        }
      }
    }
  }
  return results;
}

const allSwitches = getAllSwitches();

function handleSearch(query) {
  const resultsDiv = document.getElementById('searchResults');
  const breadcrumb = document.getElementById('breadcrumb');
  const content = document.getElementById('content');
  
  if (!query.trim()) {
    resultsDiv.innerHTML = '';
    breadcrumb.style.display = 'flex';
    content.style.display = 'block';
    render();
    return;
  }
  
  breadcrumb.style.display = 'none';
  content.style.display = 'none';
  
  const q = query.toLowerCase();
  const matches = allSwitches.filter(sw => sw.name.toLowerCase().includes(q));
  
  if (matches.length === 0) {
    resultsDiv.innerHTML = '<p class="search-hint">No switches found</p>';
    return;
  }
  
  const sorted = matches.sort((a, b) => getForce(a.name) - getForce(b.name));
  
  resultsDiv.innerHTML = `
    <p class="search-count">${matches.length} switch${matches.length === 1 ? '' : 'es'} found</p>
    <div class="search-results">
      ${sorted.map(sw => `
        <div class="search-result-item">
          <a href="${getSearchUrl(sw.name)}" target="_blank">${sw.name}</a>
          <span class="search-result-path"><a href="#" class="type-${sw.type}" onclick="jumpToCategory('${sw.type}','${sw.sound}','${sw.force}'); return false;">${sw.path}</a></span>
        </div>
      `).join('')}
    </div>
    <p class="disclaimer">Data sourced from <a href="https://kbd.news/switch/" target="_blank">kbd.news</a></p>
  `;
}

function jumpToCategory(type, sound, force) {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('breadcrumb').style.display = 'flex';
  document.getElementById('content').style.display = 'block';
  path = [type, sound, force];
  render();
}

function render() {
  renderBreadcrumb();
  const content = document.getElementById('content');
  const topRestart = document.getElementById('topRestart');
  
  // Show top restart button only when we have selections
  topRestart.style.display = path.length > 0 ? 'block' : 'none';
  
  if (path.length === 0) {
    content.innerHTML = `
      <div class="question">What type of switch speaks to your soul?</div>
      <div class="options">
        <div class="option" onclick="choose('linear')">
          <div class="label">Linear</div>
        </div>
        <div class="option" onclick="choose('tactile')">
          <div class="label">Tactile</div>
        </div>
        <div class="option" onclick="choose('clicky')">
          <div class="label">Clicky</div>
        </div>
      </div>`;
    return;
  }

  const type = path[0];
  
  if (type === 'linear' || (type === 'tactile' && path.length === 1)) {
    if (path.length === 1) {
      content.innerHTML = `
        <div class="question">How should it sound?</div>
        <div class="options">
          <div class="option" onclick="choose('silent')">
            <div class="label">Silent</div>
          </div>
          <div class="option" onclick="choose('thocky')">
            <div class="label">Thocky</div>
          </div>
          <div class="option" onclick="choose('clacky')">
            <div class="label">Clacky</div>
          </div>
        </div>`;
      return;
    }
  }

  if (type === 'linear' && path.length === 2) {
    content.innerHTML = `
      <div class="question">How hard do you want to press?</div>
      <div class="options">
        <div class="option" onclick="choose('light')">
          <div class="label">Light</div>
        </div>
        <div class="option" onclick="choose('medium')">
          <div class="label">Medium</div>
        </div>
        <div class="option" onclick="choose('heavy')">
          <div class="label">Heavy</div>
        </div>
      </div>`;
    return;
  }

  if (type === 'linear' && path.length === 3) {
    const switches = data.linear[path[1]][path[2]];
    showResult(switches);
    return;
  }

  if (type === 'tactile' && path.length === 2) {
    content.innerHTML = `
      <div class="question">How much bump we talking?</div>
      <div class="options">
        <div class="option" onclick="choose('large')">
          <div class="label">Large</div>
        </div>
        <div class="option" onclick="choose('small')">
          <div class="label">Small</div>
        </div>
      </div>`;
    return;
  }

  if (type === 'tactile' && path.length === 3) {
    const switches = data.tactile[path[1]][path[2]];
    showResult(switches);
    return;
  }

  if (type === 'clicky' && path.length === 1) {
    content.innerHTML = `
      <div class="question">What kind of click sound?</div>
      <div class="options">
        <div class="option" onclick="choose('bar')">
          <div class="label">Sharp & metallic</div>
        </div>
        <div class="option" onclick="choose('jacket')">
          <div class="label">Thick & plasticky</div>
        </div>
      </div>`;
    return;
  }

  if (type === 'clicky' && path.length === 2) {
    content.innerHTML = `
      <div class="question">How much force to unleash the click?</div>
      <div class="options">
        <div class="option" onclick="choose('light')">
          <div class="label">Light</div>
        </div>
        <div class="option" onclick="choose('medium')">
          <div class="label">Medium</div>
        </div>
        <div class="option" onclick="choose('heavy')">
          <div class="label">Heavy</div>
        </div>
      </div>`;
    return;
  }

  if (type === 'clicky' && path.length === 3) {
    const switches = data.clicky[path[1]][path[2]];
    showResult(switches);
    return;
  }
}

function getForce(s) {
  const match = s.match(/\((\d+)(?:-(\d+))?g\)/);
  if (!match) return 999;
  return parseInt(match[1]);
}

function getSwitchName(s) {
  return s.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

function getSearchUrl(s) {
  const name = getSwitchName(s);
  return `https://www.google.com/search?q=${encodeURIComponent(name + ' mechanical switch')}`;
}

function showResult(switches) {
  const content = document.getElementById('content');
  const sorted = [...switches].sort((a, b) => getForce(a) - getForce(b));
  content.innerHTML = `
    <div class="result-wrapper">
      <div class="result">
        <div class="switches">
          ${sorted.map(s => `<div class="switch-rec"><a href="${getSearchUrl(s)}" target="_blank">${s}</a></div>`).join('')}
        </div>
        <p class="disclaimer">Data sourced from <a href="https://kbd.news/switch/" target="_blank">kbd.news</a></p>
      </div>
    </div>`;
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (path.length === 0) {
    bc.style.display = 'none';
    return;
  }
  bc.style.display = 'flex';
  bc.innerHTML = path.map((p, i) => {
    const typeClass = i === 0 ? `type-${p}` : '';
    return `<span class="crumb ${typeClass}" onclick="goTo(${i})">${p}</span>`;
  }).join('<span class="arrow">→</span>');
}

function choose(value) {
  path.push(value);
  render();
}

function goTo(index) {
  path = path.slice(0, index);
  render();
}

function restart() {
  path = [];
  render();
}

render();
</script>
</body>
</html>
