<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"><rect width="960" height="720" fill="#fbfaf7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#c0392b"/></marker><marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,4 L7,1 L7,7 z" fill="#c0392b"/></marker></defs><rect x="315.9" y="492.8" width="28.2" height="140.8" fill="#c9a227" stroke="#8f7318" stroke-width="2" rx="0"/><polygon points="315.9,633.6 344.1,633.6 330.0,649.0" fill="#c9a227" stroke="#8f7318" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="306.2" y="488.4" width="47.5" height="167.2" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4" rx="8"/><rect x="295.9" y="330.0" width="68.2" height="162.8" fill="#c9a227" stroke="#8f7318" stroke-width="2" rx="0"/><rect x="306.9" y="330.0" width="46.2" height="147.4" fill="#f5efdd" stroke="none" stroke-width="1" rx="0"/><polyline points="308.0,341.0 323.0,396.0 308.0,444.4" fill="none" stroke="#a05a2c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="352.0,341.0 337.0,396.0 352.0,444.4" fill="none" stroke="#a05a2c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="286.0" y="303.6" width="88.0" height="26.4" fill="#c9a227" stroke="#8f7318" stroke-width="2" rx="0"/><polygon points="302.7,303.6 316.8,323.4 343.2,323.4 357.3,303.6" fill="#3d3d3d" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="323.8" y="189.2" width="12.3" height="101.2" fill="#8a8f98" stroke="#5c6067" stroke-width="1.5" rx="0"/><text x="330" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">switch pin</text><line x1="369.6" y1="215.6" x2="345.4" y2="277.2" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/><text x="374" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#222">plugs in from the top (hotswap)</text><rect x="215.6" y="330.0" width="78.5" height="123.2" fill="#9aa2ab" stroke="#6d757e" stroke-width="1" rx="0"/><rect x="365.9" y="330.0" width="78.5" height="123.2" fill="#9aa2ab" stroke="#6d757e" stroke-width="1" rx="0"/><text x="218" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#3c434b">printed</text><text x="218" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#3c434b">floor</text><line x1="462.0" y1="492.8" x2="462.0" y2="303.6" stroke="#c0392b" stroke-width="1.4" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="469" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">~4.3 mm body</text><line x1="462.0" y1="633.6" x2="462.0" y2="492.8" stroke="#c0392b" stroke-width="1.4" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="469" y="567" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#c0392b" font-weight="bold">~3 mm TAIL</text><line x1="315.9" y1="673.2" x2="344.1" y2="673.2" stroke="#c0392b" stroke-width="1.4" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="330" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">φ0.64 mm</text><text x="480" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">What is the solder tail? — Mill-Max receptacle anatomy</text><text x="480" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666" font-style="italic">Part: Mill-Max 0300-1-15-15-47-27-10-0  (DigiKey ED90337-ND style listing, ~$0.79 ea) — accepts 0.64–0.94 mm pins</text><text x="70" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">MOUTH: funnel opening</text><text x="70" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">in the shoulder</text><line x1="64" y1="204" x2="308.0" y2="310.2" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="308.0" cy="310.2" r="2.6" fill="#555"/><text x="70" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">CONTACT CLIP: 4 spring</text><text x="70" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">fingers inside grip the</text><text x="70" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">switch pin — this is the</text><text x="70" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">hotswap part</text><line x1="64" y1="300" x2="314.6" y2="391.6" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="314.6" cy="391.6" r="2.6" fill="#555"/><text x="70" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">BARREL: machined brass</text><text x="70" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">sleeve — press-fits into a</text><text x="70" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">hole in the printed floor</text><line x1="64" y1="412" x2="295.9" y2="470.8" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="295.9" cy="470.8" r="2.6" fill="#555"/><text x="70" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">TAIL: solid brass pin,</text><text x="70" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">one piece with the barrel.</text><text x="70" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">On a normal PCB it goes</text><text x="70" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">through a plated hole and</text><text x="70" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">is soldered like a resistor</text><text x="70" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">leg. In our adapter: bend it</text><text x="70" y="601" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">1.3–2.7 mm sideways into</text><text x="70" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">the PG1425 hole.</text><line x1="64" y1="557" x2="332.2" y2="563.2" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="332.2" cy="563.2" r="2.6" fill="#555"/><text x="660" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">SHOULDER: stops the barrel</text><text x="660" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">at the floor surface</text><line x1="654" y1="234" x2="369.6" y2="316.8" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="369.6" cy="316.8" r="2.6" fill="#555"/><text x="660" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">The tail is NOT a separate part —</text><text x="660" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">barrel + tail are machined from one</text><text x="660" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">piece of brass, then gold plated.</text><text x="660" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">Beware: parts sold as "No Tail"</text><text x="660" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c0392b">(e.g. 0305-2, 7305) end flush at the</text><text x="660" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c0392b">barrel bottom — no metal to reach</text><text x="660" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c0392b">the PG1425 hole. Filter DigiKey by</text><text x="660" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#c0392b">Tail Type = "Standard Tail".</text><text x="480" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">Dimensions approximate — confirm on the Mill-Max 0300 datasheet before ordering</text></svg>