.4</text><text x="480" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">Option B — Kailh Choc hotswap socket + soldered pin stubs</text><text x="480" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666" font-style="italic">Cross-section, schematic — socket clipped into a pocket under the adapter floor</text><text x="660" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Choc V1 switch (PG1350)</text><line x1="654" y1="146" x2="556.0" y2="300.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="556.0" cy="300.0" r="2.6" fill="#555"/><text x="660" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Choc pin passes through the</text><text x="660" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">1.6 mm web — exactly like a</text><text x="660" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">hotswap PCB</text><line x1="654" y1="252" x2="470.0" y2="428.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="470.0" cy="428.0" r="2.6" fill="#555"/><text x="660" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Socket mouth grips the pin</text><text x="660" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">(designed for Choc pins)</text><line x1="654" y1="334" x2="478.0" y2="456.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="478.0" cy="456.0" r="2.6" fill="#555"/><text x="700" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">SMD pad (pre-tinned tab)</text><line x1="694" y1="406" x2="512.0" y2="477.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="512.0" cy="477.0" r="2.6" fill="#555"/><text x="700" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">~4 mm stub of 0.8 mm solid wire</text><text x="700" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">SOLDERED to the pad, pointing</text><text x="700" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">straight down into the PTH</text><line x1="694" y1="542" x2="527.0" y2="488.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="527.0" cy="488.0" r="2.6" fill="#555"/><text x="660" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Solder joint on PCB underside</text><line x1="654" y1="626" x2="520.0" y2="524.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="520.0" cy="524.0" r="2.6" fill="#555"/><text x="220" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">3D-printed adapter shell</text><text x="220" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">(floor +0.6 mm thicker than</text><text x="220" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">Option A → taller stack)</text><line x1="226" y1="177" x2="298.0" y2="392.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="298.0" cy="392.0" r="2.6" fill="#555"/><text x="220" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">Kailh Choc hotswap socket</text><text x="220" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">CPG135001S30, clipped into</text><text x="220" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">printed pocket (self-fixturing)</text><line x1="226" y1="292" x2="360.0" y2="462.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="360.0" cy="462.0" r="2.6" fill="#555"/><text x="220" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">Do NOT bend the SMD pads —</text><text x="220" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">stamped bronze cracks; solder</text><text x="220" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">a stub to them instead</text><line x1="226" y1="412" x2="308.0" y2="477.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="308.0" cy="477.0" r="2.6" fill="#555"/><text x="220" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">Stub prepared on the bench in a</text><text x="220" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#222">printed jig, before assembly</text><line x1="226" y1="504" x2="294.0" y2="500.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="294.0" cy="500.0" r="2.6" fill="#555"/><text x="480" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#666">Assembly per key: solder 2 stubs to socket pads (bench, jigged) → clip socket into pocket → snap Choc in → set on PCB → 2 solder joints underneath</text></svg>