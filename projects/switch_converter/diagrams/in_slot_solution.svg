e="none" stroke-width="1"/><circle cx="250.0" cy="199.7" r="10.2" fill="#8a8f98" stroke="#444" stroke-width="1.5"/><circle cx="335.0" cy="235.4" r="10.2" fill="#8a8f98" stroke="#444" stroke-width="1.5"/><circle cx="343.5" cy="393.5" r="10.2" fill="none" stroke="#3c434b" stroke-width="1.8"/><circle cx="156.5" cy="206.5" r="10.2" fill="none" stroke="#3c434b" stroke-width="1.8"/><text x="480" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">The captive-channel solution — v3.1 adapter</text><text x="480" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666" font-style="italic">Top: floor viewed from above with the two wire channels (true SCAD paths). Bottom: section along channel 1.</text><text x="560" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Choc pin drops in here — through-</text><text x="560" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">pocket (φ1.6) at (0,5.9) & (5,3.8)</text><line x1="554" y1="114" x2="335.0" y2="235.4" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="335.0" cy="235.4" r="2.6" fill="#555"/><text x="560" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">0.6 mm bus wire laid into the channel</text><text x="560" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">from ABOVE — channel is the jig</text><line x1="554" y1="179" x2="312.9" y2="289.8" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="312.9" cy="289.8" r="2.6" fill="#555"/><text x="560" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Channel 2 detours around the</text><text x="560" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">center/side-post pockets</text><line x1="554" y1="244" x2="290.8" y2="351.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="290.8" cy="351.0" r="2.6" fill="#555"/><text x="560" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Wire exit through-hole (φ1.4) —</text><text x="560" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">wire bends down into PG1425 hole</text><line x1="554" y1="304" x2="192.2" y2="334.0" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="192.2" cy="334.0" r="2.6" fill="#555"/><text x="560" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Printed alignment pins (bottom)</text><text x="560" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">index the whole thing on the PCB</text><line x1="554" y1="364" x2="343.5" y2="393.5" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="343.5" cy="393.5" r="2.6" fill="#555"/><text x="120" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Channels: 1.4 mm wide, open at the</text><text x="120" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">TOP only — a 0.5 mm floor membrane</text><text x="120" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">closes the bottom so the wire</text><text x="120" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">cannot fall out</text><line x1="114" y1="130" x2="221.1" y2="225.2" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><circle cx="221.1" cy="225.2" r="2.6" fill="#555"/><rect x="198.0" y="640.0" width="408.0" height="54.4" fill="#2f7d43" stroke="#1d5a2e" stroke-width="1.5"/><rect x="435.3" y="640.0" width="37.4" height="54.4" fill="#f2ede2" stroke="none" stroke-width="1"/><rect x="425.1" y="640.0" width="57.8" height="6.1" fill="#c87533" stroke="none" stroke-width="1"/><rect x="425.1" y="688.3" width="57.8" height="6.1" fill="#c87533" stroke="none" stroke-width="1"/><rect x="198.0" y="544.8" width="74.8" height="95.2" fill="#9aa2ab" stroke="#6d757e" stroke-width="1.5"/><rect x="477.8" y="544.8" width="128.2" height="95.2" fill="#9aa2ab" stroke="#6d757e" stroke-width="1.5"/><rect x="327.2" y="623.0" width="103.0" height="17.0" fill="#9aa2ab" stroke="#6d757e" stroke-width="1.5"/><rect x="198.0" y="483.6" width="408.0" height="61.2" fill="#d9b380" stroke="#b28a54" stroke-width="1.5"/><rect x="294.9" y="544.8" width="10.2" height="90.1" fill="#8a8f98" stroke="#5c6067" stroke-width="1.5"/><polyline points="300,613 454,613 454,691" fill="none" stroke="#c87533" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="611" r="9" fill="#b9bcc4" stroke="#8d919a"/><polygon points="438,694 470,694 459,707 449,707" fill="#b9bcc4" stroke="#8d919a"/><text x="480" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">Section along channel 1 — 0.5 mm membrane traps the wire; switch body caps the top</text><text x="300" y="491" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Choc pin in entry pocket (full depth)</text><line x1="300" y1="495" x2="300" y2="565" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><text x="375" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8a4e1f" font-weight="bold">wire on membrane</text><text x="382" y="639" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#3c434b" font-weight="bold">0.5 mm membrane (closed bottom)</text><text x="270" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#222">solder pin↔wire (via entry pocket)</text><text x="484" y="718" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#222">solder wire↔PCB (underside, via exit hole)</text><text x="225" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">floor 2.8</text><text x="545" y="671" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">PCB 1.6</text><text x="480" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666" font-style="italic">Assembly: lay wire into channel from above → seat switch (caps channel, pin lands beside wire) → solder at entry pocket + exit hole</text></svg>