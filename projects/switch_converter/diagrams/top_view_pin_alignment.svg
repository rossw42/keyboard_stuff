<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700"><rect width="960" height="700" fill="#fbfaf7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#c0392b"/></marker><marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,4 L7,1 L7,7 z" fill="#c0392b"/></marker></defs><rect x="24.0" y="74.0" width="572.0" height="572.0" fill="#2f7d43" stroke="#1d5a2e" stroke-width="2" rx="6"/><rect x="145.0" y="195.0" width="330.0" height="330.0" fill="none" stroke="#fbfaf7" stroke-width="2" stroke-dasharray="7,5" rx="0"/><ellipse cx="310.0" cy="360.0" rx="56.1" ry="45.1" fill="#14401c" stroke="#0c2a12" stroke-width="1.5"/><circle cx="431.0" cy="461.2" r="14.3" fill="#14401c" stroke="#cfd8cf" stroke-width="1.5"/><circle cx="189.0" cy="219.2" r="14.3" fill="#14401c" stroke="#cfd8cf" stroke-width="1.5"/><circle cx="235.2" cy="276.4" r="17.6" fill="#c87533" stroke="#8a4e1f" stroke-width="1.5"/><circle cx="235.2" cy="276.4" r="12.1" fill="#f2ede2" stroke="none" stroke-width="1"/><circle cx="235.2" cy="384.2" r="15.4" fill="#c87533" stroke="#8a4e1f" stroke-width="1.5"/><circle cx="235.2" cy="384.2" r="12.1" fill="#f2ede2" stroke="none" stroke-width="1"/><rect x="299.0" y="219.2" width="22.0" height="22.0" fill="none" stroke="#e8e0c8" stroke-width="1.6" stroke-dasharray="3,3" rx="0"/><rect x="409.0" y="265.4" width="22.0" height="22.0" fill="none" stroke="#e8e0c8" stroke-width="1.6" stroke-dasharray="3,3" rx="0"/><rect x="215.4" y="239.0" width="22.0" height="22.0" fill="#ffd23f" stroke="#8f7318" stroke-width="1.6" rx="0"/><rect x="169.2" y="349.0" width="22.0" height="22.0" fill="#ffd23f" stroke="#8f7318" stroke-width="1.6" rx="0"/><line x1="226.4" y1="250.0" x2="234.1" y2="273.1" stroke="#ff5544" stroke-width="2.5" marker-end="url(#arr)"/><line x1="180.2" y1="360.0" x2="231.9" y2="382.0" stroke="#ff5544" stroke-width="2.5" marker-end="url(#arr)"/><text x="244" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#ffdcd6" font-weight="bold">1.26 mm</text><text x="178" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#ffdcd6" font-weight="bold">2.73 mm</text><text x="310" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9fbfa4">central cutout</text><text x="310" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e8f0e8">adapter footprint 15 × 15 (dashed)</text><text x="480" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">Top view — why rotating the Choc 90° CCW almost solves it</text><text x="480" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666" font-style="italic">PG1425 PCB seen from above; Choc pin landing spots vs. PG1425 plated holes (to scale)</text><text x="660" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#222" font-weight="bold">Legend</text><circle cx="669" cy="154" r="8" fill="#c87533" stroke="#666"/><text x="686" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#222">PG1425 plated hole (1.1 mm drill)</text><circle cx="669" cy="184" r="8" fill="#14401c" stroke="#666"/><text x="686" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#222">φ1.3 locating hole (alignment post)</text><rect x="661" y="206" width="16" height="16" fill="#ffd23f" stroke="#8f7318"/><text x="686" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#222">Choc pin, switch rotated 90° CCW</text><rect x="661" y="236" width="16" height="16" fill="none" stroke="#b8a86a" stroke-dasharray="3,3" stroke-width="1.6"/><text x="686" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#222">Choc pin at 0° (reference)</text><line x1="660" y1="274" x2="678" y2="274" stroke="#ff5544" stroke-width="2.5" marker-end="url(#arr)"/><text x="686" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#222">Required jog — bendable distance</text><text x="660" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#666">Trade-off: keycap sits rotated 90°.</text><text x="660" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#666">Fine for blank caps; sideways</text><text x="660" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#666">legends otherwise. Keep 0° as a</text><text x="660" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#666">parametric variant (needs the</text><text x="660" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#666">bus-wire bridge, Option D).</text></svg>