# /etc/keyd/default.conf — Cyberdeck starter keyd config
#
# All USER remapping (layers, tap/hold, macros) lives here.
# The scan daemon (cyberdeck-kbd) only emits physical keycodes.
#
# Apply changes instantly:   sudo keyd reload
# Watch key names live:      sudo keyd monitor
# Panic (kill keyd):         press backspace+escape+enter together
#
# keyd syntax reference: man keyd  /  https://github.com/rvaiya/keyd

[ids]
# Match the cyberdeck virtual keyboard (vendor 1209, product cd68) and
# any USB keyboard plugged in for recovery. '*' only matches keyboards,
# and keyd always ignores its own virtual output device.
*

[main]
# The stock Micro Journal "fn" key (matrix [7,1], stock MO(1)) is emitted
# by the scan daemon as f13. Hold it to activate the fn layer below.
f13 = layer(fn)

# --- examples (uncomment to taste) ---------------------------------
# tap capslock = esc, hold = ctrl (writer favorite):
# capslock = overload(control, esc)

# fn layer — mirrors the stock Vial layer 1 (F-keys on the number row,
# printscreen on PgUp) plus handy nav on hjkl.
[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12
pageup = sysrq
h = left
j = down
k = up
l = right