pcbs:
  biaxial_mx:
    template: kicad8
    outlines:
      edge:
        outline: pcb_outline
    footprints:
      switches:
        what: "ceoloide/switch_mx"
        where: [key]
        params:
          hotswap: true
          reversible: false
          include_keycap: true
          from: "{{column_net}}"
          to: "{{name}}"
      diodes:
        what: "ceoloide/diode_tht_sod123"
        where: [key]
        params:
          from: "{{name}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
      # nice!nano / Pro Micro-compatible controller, top-center of the gap
      # (USB toward the top edge). 15 matrix nets: 10 cols + 5 rows.
      mcu:
        what: "ceoloide/mcu_nice_nano"
        where:
          shift: [mid_x, mid_y + 19]
        params:
          P1: col0
          P0: col1
          P2: col2
          P3: col3
          P4: col4
          P5: col5
          P6: col6
          P7: col7
          P8: col8
          P9: col9
          P10: row0
          P16: row1
          P14: row2
          P15: row3
          P18: row4
      reset:
        what: "ceoloide/reset_switch_smd_side"
        where:
          shift: [mid_x, mid_y - 1]
        params:
          from: GND
          to: RST
      hole_1:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: [mid_x - 89.7938, "mid_y + 19.05"]
      hole_2:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: [mid_x - 91.3438, mid_y - 15.7]
      hole_3:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: [mid_x - 44.4438, mid_y - 27.25]
      hole_4:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: [mid_x - 13.5938, "mid_y + 19.05"]
      hole_5:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: ["mid_x + 16.8963", mid_y - 0.05]
      hole_6:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: ["mid_x + 89.4463", "mid_y + 21.35"]
      hole_7:
        what: "ceoloide/mounting_hole_npth"
        where:
          shift: ["mid_x + 61.1463", mid_y - 27.45]
