# biaxial — Ergogen v4 config generated by kbforge
# Source: KLE layout (42 switches)
#
# Review/edit this config, then build it (runs Ergogen + renders
# case STLs):
#   python -m kbforge <this file> -o <out>
#
# Manual build — PCB footprints: ceoloide/ergogen-footprints (KiCad 8).
# Ergogen loads custom footprints from a `footprints` folder next to
# a `config.yaml`, so:
#   1. rename this file to config.yaml
#   2. clone https://github.com/ceoloide/ergogen-footprints into
#      footprints/ceoloide (alongside config.yaml)
#   3. npx ergogen <that folder> -o output/
#   4. npx @jscad/cli@1 output/cases/<case>.jscad -o <case>.stl
# Output: outlines/*.dxf, pcbs/*.kicad_pcb, cases/*.jscad (+ .stl via the build step)
