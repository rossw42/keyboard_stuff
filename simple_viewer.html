<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Keymap Viewer</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 20px;
            line-height: 1.4;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 28px;
            color: #4CAF50;
            margin-bottom: 10px;
        }
        
        .status {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }
        
        .file-info {
            color: #81C784;
            font-size: 14px;
        }
        
        .last-update {
            color: #FFB74D;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .content-area {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .keymap-content {
            background: #1e1e1e;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn:hover {
            background: #45a049;
        }
        
        .btn.secondary {
            background: #2196F3;
        }
        
        .btn.secondary:hover {
            background: #1976D2;
        }
        
        .live-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 11px;
            z-index: 1000;
        }
        
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .error {
            background: #f44336;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .highlight {
            background: #333;
            padding: 2px 4px;
            border-radius: 2px;
            color: #FFB74D;
        }
        
        /* Visual Keymap Styles */
        .visual-keymap {
            margin: 20px 0;
        }
        
        .layer-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .layer-tab {
            background: #444;
            color: #ccc;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .layer-tab.active {
            background: #4CAF50;
            color: white;
        }
        
        .layer-content {
            display: none;
        }
        
        .layer-content.active {
            display: block;
        }
        
        .key-grid {
            display: grid;
            gap: 8px;
            justify-content: center;
            margin: 15px 0;
        }
        
        .key-grid.grid-3x4 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            max-width: 400px;
        }
        
        .key {
            background: #555;
            border: 2px solid #777;
            border-radius: 6px;
            padding: 12px 8px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            min-width: 60px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.2s;
        }
        
        .key:hover {
            background: #666;
            border-color: #4CAF50;
        }
        
        .key.modifier {
            background: #FF9800;
            color: #000;
        }
        
        .key.function {
            background: #2196F3;
            color: #fff;
        }
        
        .key.media {
            background: #9C27B0;
            color: #fff;
        }
        
        .key.rgb {
            background: #E91E63;
            color: #fff;
        }
        
        .combo-info {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 12px;
        }
        
        .combo-item {
            margin: 5px 0;
            color: #81C784;
        }
    </style>
</head>
<body>
    <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="live-status">Live</span>
    </div>

    <div class="container">
        <div class="header">
            <div class="title">🎹 Simple Keymap Viewer</div>
            <div style="color: #B0BEC5;">Live keymap.c file monitoring</div>
        </div>

        <div class="status">
            <div class="file-info">
                📁 Watching: <span class="highlight" id="current-file">Loading...</span>
            </div>
            <div class="last-update" id="last-update">
                Last update: Never
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="refreshContent()">🔄 Refresh</button>
            <button class="btn secondary" onclick="toggleAutoUpdate()">⏸️ Pause</button>
            <button class="btn secondary" onclick="copyContent()">📋 Copy Content</button>
        </div>

        <div class="content-area">
            <h3 style="color: #4CAF50; margin-top: 0;">🎹 Visual Keymap</h3>
            <div id="visual-keymap">
                Loading visual keymap...
            </div>
        </div>

        <div class="content-area">
            <h3 style="color: #4CAF50; margin-top: 0;">📝 Raw Keymap Content</h3>
            <div class="keymap-content" id="keymap-content">
                Loading keymap content...
            </div>
        </div>
    </div>

    <script>
        let autoUpdate = true;
        let updateInterval;
        let lastTimestamp = 0;

        async function loadKeymapData() {
            try {
                const response = await fetch('/api/keymap');
                const data = await response.json();
                
                // Update file info
                if (data.file) {
                    const fileName = data.file.split(/[/\\]/).pop();
                    const filePath = data.file.replace(/\\/g, '/');
                    document.getElementById('current-file').textContent = filePath;
                }
                
                // Update content if changed
                if (data.timestamp > lastTimestamp) {
                    lastTimestamp = data.timestamp;
                    
                    if (data.content) {
                        document.getElementById('keymap-content').textContent = data.content;
                        parseAndVisualizeKeymap(data.content);
                    }
                    
                    // Update timestamp
                    const date = new Date(data.timestamp * 1000);
                    document.getElementById('last-update').textContent = 
                        `Last update: ${date.toLocaleTimeString()}`;
                    
                    // Flash the live indicator
                    const indicator = document.getElementById('live-status');
                    indicator.textContent = 'Updated!';
                    setTimeout(() => {
                        indicator.textContent = 'Live';
                    }, 2000);
                }
                
            } catch (error) {
                console.error('Error loading keymap data:', error);
                document.getElementById('keymap-content').innerHTML = 
                    `<div class="error">Error loading keymap data: ${error.message}</div>`;
            }
        }

        function refreshContent() {
            loadKeymapData();
        }

        function toggleAutoUpdate() {
            autoUpdate = !autoUpdate;
            const btn = event.target;
            
            if (autoUpdate) {
                btn.textContent = '⏸️ Pause';
                startAutoUpdate();
                document.getElementById('live-status').textContent = 'Live';
            } else {
                btn.textContent = '▶️ Resume';
                if (updateInterval) clearInterval(updateInterval);
                document.getElementById('live-status').textContent = 'Paused';
            }
        }

        function copyContent() {
            const content = document.getElementById('keymap-content').textContent;
            navigator.clipboard.writeText(content).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        function startAutoUpdate() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                if (autoUpdate) {
                    loadKeymapData();
                }
            }, 2000); // Check every 2 seconds
        }

        // Parse and visualize keymap
        function parseAndVisualizeKeymap(content) {
            const layers = parseKeymapLayers(content);
            const combos = parseKeymapCombos(content);
            renderVisualKeymap(layers, combos);
        }
        
        function parseKeymapLayers(content) {
            const layers = [];
            
            // Extract keymap definition
            const keymapRegex = /const uint16_t PROGMEM keymaps\[\]\[MATRIX_ROWS\]\[MATRIX_COLS\] = \{([\s\S]*?)\};/;
            const match = content.match(keymapRegex);
            
            if (!match) return layers;
            
            const keymapContent = match[1];
            
            // Extract individual layers
            const layerRegex = /\[(\d+)\]\s*=\s*LAYOUT\(([\s\S]*?)\)/g;
            let layerMatch;
            
            while ((layerMatch = layerRegex.exec(keymapContent)) !== null) {
                const layerNum = parseInt(layerMatch[1]);
                const keysString = layerMatch[2];
                
                // Parse keys
                const keys = keysString
                    .split(',')
                    .map(key => key.trim().replace(/KC_/, ''))
                    .filter(key => key.length > 0);
                
                layers[layerNum] = keys;
            }
            
            return layers;
        }
        
        function parseKeymapCombos(content) {
            const combos = [];
            
            // Extract combo definitions
            const comboRegex = /const uint16_t PROGMEM combo_(\w+)\[\] = \{([^}]+)\};/g;
            let comboMatch;
            
            while ((comboMatch = comboRegex.exec(content)) !== null) {
                const comboName = comboMatch[1];
                const keysString = comboMatch[2];
                
                const keys = keysString
                    .split(',')
                    .map(key => key.trim().replace(/KC_/, ''))
                    .filter(key => key !== 'COMBO_END' && key.length > 0);
                
                combos.push({ name: comboName, keys: keys });
            }
            
            return combos;
        }
        
        function renderVisualKeymap(layers, combos) {
            const container = document.getElementById('visual-keymap');
            
            if (!layers.length) {
                container.innerHTML = '<div class="error">No layers found in keymap</div>';
                return;
            }
            
            let html = '<div class="visual-keymap">';
            
            // Layer tabs
            html += '<div class="layer-tabs">';
            for (let i = 0; i < layers.length; i++) {
                if (layers[i]) {
                    const active = i === 0 ? 'active' : '';
                    html += `<button class="layer-tab ${active}" onclick="showLayer(${i})">Layer ${i}</button>`;
                }
            }
            html += '</div>';
            
            // Layer contents
            for (let i = 0; i < layers.length; i++) {
                if (layers[i]) {
                    const active = i === 0 ? 'active' : '';
                    html += `<div class="layer-content ${active}" id="layer-${i}">`;
                    html += renderKeyGrid(layers[i], i);
                    html += '</div>';
                }
            }
            
            // Combos
            if (combos.length > 0) {
                html += '<div class="combo-info">';
                html += '<strong>🔗 Key Combos:</strong><br>';
                combos.forEach(combo => {
                    html += `<div class="combo-item">${combo.keys.join(' + ')} → ${combo.name}</div>`;
                });
                html += '</div>';
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderKeyGrid(keys, layerNum) {
            let html = `<div class="key-grid grid-3x4">`;
            
            keys.forEach(key => {
                const keyClass = getKeyClass(key);
                const displayKey = formatKeyDisplay(key);
                html += `<div class="key ${keyClass}">${displayKey}</div>`;
            });
            
            html += '</div>';
            return html;
        }
        
        function getKeyClass(key) {
            if (key.startsWith('F') && key.length <= 3) return 'function';
            if (['MUTE', 'VOLD', 'VOLU', 'MPLY', 'MPRV', 'MNXT', 'MSTP', 'CALC'].includes(key)) return 'media';
            if (key.startsWith('RGB_')) return 'rgb';
            if (['LSFT', 'RSFT', 'LCTL', 'RCTL', 'LALT', 'RALT', 'LGUI', 'RGUI'].includes(key)) return 'modifier';
            return '';
        }
        
        function formatKeyDisplay(key) {
            const keyMap = {
                'BSPC': '⌫',
                'ENT': '↵',
                'SPC': '␣',
                'TAB': '⇥',
                'ESC': 'Esc',
                'MUTE': '🔇',
                'VOLD': '🔉',
                'VOLU': '🔊',
                'MPLY': '⏯️',
                'MPRV': '⏮️',
                'MNXT': '⏭️',
                'MSTP': '⏹️',
                'CALC': '🧮',
                'RGB_TOG': 'RGB',
                'RGB_MOD': 'MODE',
                'RGB_HUI': 'HUE+',
                'RGB_SAI': 'SAT+'
            };
            
            return keyMap[key] || key;
        }
        
        function showLayer(layerNum) {
            // Hide all layers
            document.querySelectorAll('.layer-content').forEach(layer => {
                layer.classList.remove('active');
            });
            document.querySelectorAll('.layer-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected layer
            document.getElementById(`layer-${layerNum}`).classList.add('active');
            document.querySelectorAll('.layer-tab')[layerNum].classList.add('active');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎹 Simple Keymap Viewer loaded');
            loadKeymapData();
            startAutoUpdate();
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    switch(e.key) {
                        case 'r':
                            e.preventDefault();
                            refreshContent();
                            break;
                        case ' ':
                            e.preventDefault();
                            toggleAutoUpdate();
                            break;
                    }
                }
            });
        });
    </script>
</body>
</html>
