# 3x3 Macropad Configuration

keyboard:
  name: "3x3-Macropad"
  description: "Simple 3x3 macropad"
  version: "1.0"

layout:
  type: "macropad-3x3"
  kle_file: null

hardware:
  mcu:
    type: "atmega328p"
    bootloader: "usbasp"
  usb:
    type: "usb-c-tht"
    position: "center"

matrix:
  rows: 3
  cols: 3
  diode_direction: "COL2ROW"

pcb:
  dimensions:
    length: 80.0
    width: 80.0
    thickness: 1.6

plate:
  enabled: true
  switch_type: "mx"
  thickness: 1.5
  material: "fr4"

case:
  enabled: true
  type: "sandwich"
  layers:
    - type: "top"
      thickness: 3
      material: "acrylic"
    - type: "plate"
      thickness: 1.5
      material: "fr4"
    - type: "spacer"
      thickness: 7
      material: "acrylic"
    - type: "bottom"
      thickness: 3
      material: "acrylic"

firmware:
  qmk: true
  via: true
  vial: false
  default_keymap: "default"

output:
  gerbes: true
  kicad_files: true
  plate_dxf: true
  case_stl: true
  case_dxf: true
  firmware: true
  bom: true
  build_guide: true
