# 60% ANSI Keyboard Configuration

keyboard:
  name: "60-ANSI-Example"
  description: "Standard 60% ANSI keyboard"
  version: "1.0"

layout:
  type: "60-ansi"  # Use preset layout
  kle_file: null

hardware:
  mcu:
    type: "atmega328p"
    bootloader: "usbasp"
  usb:
    type: "usb-c-tht"
    position: "center"
  crystal:
    frequency: 16
    load_capacitance: 22

matrix:
  # Auto-calculated based on layout
  rows: 5
  cols: 15
  diode_direction: "COL2ROW"

pcb:
  dimensions:
    length: 285.0
    width: 94.6
    thickness: 1.6
  edge:
    corner_radius: 2.0

plate:
  enabled: true
  switch_type: "mx"
  thickness: 1.5
  material: "fr4"

case:
  enabled: true
  type: "sandwich"
  layers:
    - type: "top"
      thickness: 3
      material: "acrylic"
    - type: "plate"
      thickness: 1.5
      material: "fr4"
    - type: "spacer"
      thickness: 7
      material: "acrylic"
    - type: "bottom"
      thickness: 3
      material: "acrylic"

firmware:
  qmk: true
  via: true
  vial: false
  default_keymap: "ansi"

output:
  gerbers: true
  kicad_files: true
  plate_dxf: true
  case_stl: true
  case_dxf: true
  firmware: true
  bom: true
  build_guide: true
