units:
  kx: cx
  ky: cy
  mbkx: 17.5
  mbky: 16.5
  padding: 2
  px: kx+padding
  py: ky+padding
  mcu_height: 34
  mcu_width: 18
  mcu_padding: 1.5
  scrollwheel_width: 17
  scrollwheel_height: 14
  screw_diameter: 4.7
  screw_hole: 4.1

points:
  rotate: 5
  zones:
    matrix:
      anchor.shift: [50, -150]
      key:
        tags: [switch]
        padding: 1ky
        spread: 1kx
      columns:
        outer2:
          rows:
            mod.skip: true
            bottom.skip: true
            home:
              tags: [switch_top]
              bind: [0, 5, 0, 0]
              row_net: col0
            top.skip: true
            num.skip: true
          key.column_net: row0
        outer:
          rows:
            num.skip: true
            mod.skip: true
          key.column_net: row0
        pinky:
          rows.mod.skip: true
          key:
            origin: [0, 8]
            column_net: row1
        ring:
          rows.mod.skip: true
          key:
            origin: [0, 8]
            stagger: 0.66ky
            splay: -5
            column_net: row2
        middle:
          key:
            stagger: 0.33ky
            column_net: row3
          rows.mod.column_net: row1
        index:
          key:
            stagger: -0.33ky
            column_net: row4
          rows.mod.column_net: row2
        inner:
          rows.mod.skip: true
          key:
            stagger: -2.5
            column_net: row5
      rows:
        mod:
          row_net: col4
          tags: [switch_bottom]
        bottom:
          row_net: col3
          tags: [switch_top]
        home:
          row_net: col2
          tags: [switch_bottom]
        top:
          row_net: col1
          tags: [switch_top]
        num:
          row_net: col0
          tags: [switch_bottom]
    thumbs:
      anchor:
        ref: matrix_middle_home
        shift: [38, -44]
      key:
        tags: [switch]
        padding: 1ky
        spread: 1kx
      columns:
        layer:
          key:
            splay: -15
            column_net: row3
        space:
          key:
            width: 1.5kx
            splay: 75
            shift: [13-kx, -3]
            column_net: row4
            tags: [switch_space]
      rows:
        cluster:
          row_net: col4
    scrollwheel:
      anchor:
        ref: matrix_inner_bottom
      columns:
        scrollwheel:
          key:
            tags: [scrollwheel]
            shift: [kx+mcu_padding-1.25, 0]
            column_net: row5
            width: scrollwheel_width
            height: scrollwheel_height
      rows:
        scrollwheel:
          row_net: col4

outlines:
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        - ref: matrix_outer2_home
          shift: [-0.5px, -0.5py]
        - ref: matrix_outer2_home
          shift: [-0.5px, 0.5py]
        - ref: matrix_outer_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_num
          shift: [-0.5px, 0.5py]
        - ref: matrix_inner_num
          shift: [0.5px+mcu_padding+mcu_width+0.25, 0.5py]  
        - ref: matrix_inner_bottom
          shift: [0.5px+mcu_padding+mcu_width+0.25, -0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.5px, -0.5py]

pcbs:
  keyboard:
    outlines.main.outline: board
    footprints:
      choc_hotswap:
        what: choc
        where: [switch, switch_space, switch_bottom, switch_top]
        params:
          keycaps: true
          reverse: true
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
        adjust:
          rotate: 180
      scrollwheel:
        what: scrollwheel_mirrored
        where: [scrollwheel]
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      nicenano:
        what: nicenano
        where: mcu
        params:
          orientation: down
