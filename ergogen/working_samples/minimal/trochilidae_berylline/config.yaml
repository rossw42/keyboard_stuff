meta:
  engine: 4.0.0
  name: berylline
  version: 0.4
  author: jcmkk3
  url: https://github.com/jcmkk3/trochilidae

presets:
  defaults:
    capx: 17
    capy: 16
    kx: 18.5
    ky: 17.5
    pinky_splay: 5
    pinky_adj: -3
    ring_splay: 3
    ring_adj: -8
    middle_splay: 0
    middle_adj: 0
    thumb_offsetx: 0.25kx

  choc_spaced:
    $extends: presets.defaults
  
  mx_spaced:
    $extends: presets.defaults
    capx: 18
    capy: 18
    kx: 19
    ky: 19
    pinky_adj: -4
    ring_adj: -10

units:
  $extends: presets.choc_spaced
  $default_height: 0
  $default_width: 0
  promicro_x: 33
  promicro_y: 18
  sf: 15

points:
  zones.matrix:
    anchor.shift: [150, -180]
    rotate: pinky_splay + ring_splay + middle_splay
    key:
      width: capx
      height: capy
      spread: kx      
      padding: ky
    rows:
      bottom:
      home:
      top:
    columns:
      pinky:
        rows.bottom.skip: true
      ring.key:
        stagger: 2/3ky
        splay: -pinky_splay
        origin: [0, pinky_adj]
      middle.key:
        stagger: 0.25ky
        splay: -ring_splay
        origin: [0, ring_adj]
      index.key:
        stagger: -0.25ky
        splay: -middle_splay
        origin: [0, middle_adj]
      inner:
        key.stagger: -0.5ky
        rows.bottom.skip: true
  zones.thumb:
    anchor:
      ref: matrix_index_bottom
      shift: [thumb_offsetx, -22]
    key.$extends: points.zones.matrix.key
    columns:
      tucky:
      reachy.key.stagger: -0.25ky

outlines:
  panel:
    - what: polygon
      fillet: 3
      points:
      - ref: outline_top_left
      - ref: outline_top_right
      - ref: outline_bottom_right
      - ref: outline_bottom_left

pcbs.berylline:
  outlines.main:
    outline: panel
  footprints:
    - what: choc
      where:
        - /matrix_.*/
        - /thumb_.*/
      params:
        from: GND
        to: "{{name}}"
        reverse: true
        keycaps: true
    - what: promicro
      where: mcu
      adjust.shift: [1.5, 0]
      params:
        orientation: up
        P21: matrix_pinky_top
        P20: matrix_pinky_home
        P19: matrix_ring_top
        P18: matrix_ring_home
        P15: matrix_ring_bottom
        P14: matrix_middle_top
        P16: matrix_middle_home
        P10: matrix_middle_bottom
        P3: matrix_index_top
        P4: matrix_index_home
        P5: matrix_index_bottom
        P6: matrix_inner_top
        P7: matrix_inner_home
        P8: thumb_reachy
        P9: thumb_tucky
